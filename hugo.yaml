# Hugo configuration file
title: JMLtk

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
#    - name: About
#      pageRef: /about
#      weight: 2
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/jmltoolkit/jmlparser"
      params:
        icon: github

params:
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/jmltoolkit/jmltoolkit.github.io/edit/main/content"
